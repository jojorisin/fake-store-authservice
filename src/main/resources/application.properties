spring.application.name=fake-store-auth-service
#DB
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
#JWT
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}
app.cookie.refresh-expiration-seconds=${APP_COOKIE_REFRESH_EXPIRATION_SECONDS}
app.cookie.same-site=${APP_COOKIE_SAME_SITE}
app.cookie-secure=${APP_COOKIE_SECURE}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
server.port=${SERVER_PORT:8081}
